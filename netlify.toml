# Netlify config — Otla Studio
# Static site + custom content studio at /admin/ + Netlify Forms

[build]
  publish = "."

# Legacy address → the real domain ===========
# Anything requested on the default netlify.app hostname goes to otlastudio.com.
# The site itself is never served from the netlify.app URL any more, so search
# engines and old links consolidate on one canonical domain.
[[redirects]]
  from = "https://mumbai-furnishings.netlify.app/*"
  to = "https://otlastudio.com/:splat"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML should always revalidate so admin edits appear quickly
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Content studio must never be cached or indexed
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

# JSON content revalidates within a minute
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

# Uploaded images have unique filenames, so cache them for a long time
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pretty admin URL: /admin → /admin/
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Forms ====================================
# Forms are detected automatically from index.html: quote, quickquote, review.
# Add recipients in Netlify dashboard → Forms → Form notifications.
