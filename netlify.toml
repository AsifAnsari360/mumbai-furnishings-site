# Netlify config — Mumbai Furnishings v2
# Static site + Decap CMS admin + Forms + Identity

[build]
  publish = "."

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"        # SAMEORIGIN allows admin iframe; DENY would break Decap CMS
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache HTML for short period — content can update via /admin/
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache JSON content lightly — admin updates need to show within minutes
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

# Cache uploaded images aggressively (they have unique filenames)
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pretty admin URL: /admin → /admin/
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Forms ====================================
# Notification: new contact / review submissions go to your inbox.
# Configure recipients in the Netlify dashboard → Forms → Form notifications.
