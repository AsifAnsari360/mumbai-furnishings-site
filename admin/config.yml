# Decap CMS configuration for Mumbai Furnishings
# This file tells the admin panel what your team can edit.

backend:
  name: git-gateway
  branch: main          # change to "master" if your default branch is master

# Where uploaded photos will be stored in the repo
media_folder: "uploads"
public_folder: "/uploads"

# Optional: review workflow — drafts must be approved before publishing.
# Uncomment to enable.
# publish_mode: editorial_workflow

site_url: https://mumbai-furnishings.netlify.app
display_url: https://mumbai-furnishings.netlify.app
logo_url: https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=200&q=80

collections:

  # ============= 1. SITE SETTINGS =============
  - name: "settings"
    label: "⚙️  Site Settings"
    description: "Phone number, email, address, social links, hero stats."
    files:
      - file: "data/settings.json"
        label: "General Settings"
        name: "general"
        fields:
          - { label: "Business Name",          name: "businessName",     widget: "string" }
          - { label: "Tagline",                name: "tagline",          widget: "string" }
          - { label: "Phone (display)",        name: "phone",            widget: "string", hint: "e.g. +91 98765 43210" }
          - { label: "WhatsApp number",        name: "whatsapp",         widget: "string", hint: "Country code + number, NO + or spaces. e.g. 919876543210" }
          - { label: "Email",                  name: "email",            widget: "string" }
          - { label: "Address",                name: "address",          widget: "string" }
          - { label: "Hours",                  name: "hours",            widget: "string" }
          - { label: "Instagram URL",          name: "instagram",        widget: "string", required: false }
          - { label: "Facebook URL",           name: "facebook",         widget: "string", required: false }
          - { label: "YouTube URL",            name: "youtube",          widget: "string", required: false }
          - { label: "Years of Experience",    name: "yearsExperience",  widget: "string", default: "15+" }
          - { label: "Happy Homes count",      name: "happyHomes",       widget: "string", default: "3,500+" }
          - { label: "Number of artisans",     name: "artisans",         widget: "string", default: "40+" }
          - { label: "Average rating",         name: "rating",           widget: "string", default: "4.9" }
          - { label: "Review count",           name: "ratingCount",      widget: "string", default: "800+" }

  # ============= 2. PRODUCTS =============
  - name: "products"
    label: "🛋  Products"
    description: "Showcase pieces. Each one shows on the homepage with a WhatsApp inquiry button."
    files:
      - file: "data/products.json"
        label: "Products"
        name: "products"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.title}} — {{fields.category}}"
            fields:
              - { label: "Title",       name: "title",     widget: "string", hint: "e.g. Custom Sofas" }
              - { label: "Category",    name: "category",  widget: "select", options: ["Sofas","Mattresses","Curtains","Blinds","Pillows","Wooden","Repairs","Other"] }
              - { label: "Subtitle",    name: "subtitle",  widget: "string", required: false, hint: "e.g. L-shape · 2/3 seater · Recliners" }
              - { label: "Image",       name: "image",     widget: "image" }
              - { label: "Tag (optional)", name: "tag",    widget: "select", options: ["","Bestseller","New","Bespoke","Repair"], default: "", required: false }
              - { label: "Show on homepage", name: "featured", widget: "boolean", default: true }

  # ============= 3. PHOTO GALLERY =============
  - name: "gallery"
    label: "📸  Photo Gallery"
    description: "Real photos of your work. Customers filter by category."
    files:
      - file: "data/gallery.json"
        label: "Gallery Items"
        name: "gallery"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            summary: "{{fields.category}} — {{fields.caption}}"
            fields:
              - { label: "Image",    name: "image",    widget: "image" }
              - { label: "Category", name: "category", widget: "select", options: ["Sofas","Mattresses","Curtains","Blinds","Pillows","Wooden","Repairs","Other"] }
              - { label: "Caption",  name: "caption",  widget: "string", required: false, hint: "e.g. Custom L-shape for a Bandra apartment" }

  # ============= 4. BEFORE / AFTER =============
  - name: "repairs"
    label: "🔧  Before & After"
    description: "Repair showcase pairs — strong trust builders. Upload a 'before' and 'after' photo of the same piece."
    files:
      - file: "data/repairs.json"
        label: "Repair Pairs"
        name: "repairs"
        fields:
          - label: "Repair Items"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title",        name: "title",       widget: "string" }
              - { label: "Description",  name: "description", widget: "text" }
              - { label: "Before photo", name: "before",      widget: "image" }
              - { label: "After photo",  name: "after",       widget: "image" }

  # ============= 5. TESTIMONIALS =============
  - name: "testimonials"
    label: "⭐  Testimonials"
    description: "Customer reviews shown on the site. Toggle 'approved' off to hide a review temporarily."
    files:
      - file: "data/testimonials.json"
        label: "Testimonials"
        name: "testimonials"
        fields:
          - label: "Reviews"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — {{fields.location}}"
            fields:
              - { label: "Customer name", name: "name",     widget: "string" }
              - { label: "Location",      name: "location", widget: "string", hint: "e.g. Bandra West" }
              - { label: "Service",       name: "service",  widget: "string", hint: "e.g. Custom Sofa, Sofa Restoration" }
              - { label: "Rating (1-5)",  name: "rating",   widget: "number", default: 5, min: 1, max: 5 }
              - { label: "Review text",   name: "text",     widget: "text" }
              - { label: "Approved (show on site)", name: "approved", widget: "boolean", default: true }
