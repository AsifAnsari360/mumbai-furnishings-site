<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mumbai Furnishings — Team Admin</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231f1a17'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia,serif' font-size='34' font-weight='700' fill='%23b8895a'%3EM%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- Netlify Identity widget — required for team login -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Decap CMS — the admin panel itself -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // Force-open the Identity widget if the URL contains an invite, recovery,
    // or confirmation token. Decap CMS sometimes interferes with auto-detection,
    // so we trigger it manually when the page loads with a token in the hash.
    (function () {
      var hash = window.location.hash || '';
      var hasToken = /(invite_token|recovery_token|confirmation_token)=/.test(hash);

      function whenReady(cb) {
        if (window.netlifyIdentity) cb();
        else setTimeout(function () { whenReady(cb); }, 100);
      }

      whenReady(function () {
        // Standard login → /admin/ redirect (after first login)
        window.netlifyIdentity.on('init', function (user) {
          if (!user) {
            window.netlifyIdentity.on('login', function () {
              document.location.href = '/admin/';
            });
          }
        });

        // If there's a token in the URL, force the widget open so the user
        // sees the password-setup / recovery form.
        if (hasToken) {
          // Small delay to ensure the widget is fully bootstrapped.
          setTimeout(function () { window.netlifyIdentity.open(); }, 300);
        }
      });
    })();
  </script>
</body>
</html>
